name: Wake on LAN Relay

on:
  workflow_dispatch:
    inputs:
      mac_address:
        description: 'MAC address of the target PC'
        required: true
      target_ip:
        description: 'Public IP of the home network'
        required: true

jobs:
  send-wol:
    runs-on: ubuntu-latest
    steps:
      - name: Install wakeonlan tool
        run: sudo apt-get update && sudo apt-get install -y etherwake

      - name: Send Wake-on-LAN magic packet
        run: |
          echo "Sending WOL to ${{ inputs.mac_address }} at ${{ inputs.target_ip }}"
          # Convert MAC format for etherwake (use colons)
          MAC=$(echo "${{ inputs.mac_address }}" | sed 's/\(..\)/\1:/g;s/:$//')
          etherwake -b -i eth0 -p 7 "$MAC" || true
          
          # Alternative: use Python if etherwake fails
          python3 << EOF
import socket
import struct

mac = "${{ inputs.mac_address }}"
target_ip = "${{ inputs.target_ip }}"

# Clean MAC
mac_bytes = bytes.fromhex(mac.replace(":", "").replace("-", ""))

# Build magic packet
magic_packet = b"\xff" * 6 + mac_bytes * 16

# Send via UDP broadcast
sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
sock.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)
try:
    sock.sendto(magic_packet, (target_ip, 7))
    print(f"Magic packet sent to {mac} at {target_ip}")
except Exception as e:
    print(f"Error: {e}")
finally:
    sock.close()
EOF
