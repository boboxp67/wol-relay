name: Wake on LAN Relay

on:
  workflow_dispatch:
    inputs:
      mac_address:
        description: 'MAC address of the target PC'
        required: true
      target_ip:
        description: 'Public IP of the home network'
        required: true

jobs:
  send-wol:
    runs-on: ubuntu-latest
    steps:
      - name: Send Wake-on-LAN magic packet
        run: |
          MAC="${{ inputs.mac_address }}"
          TARGET_IP="${{ inputs.target_ip }}"
          
          echo "Sending WOL to $MAC at $TARGET_IP"
          
          # Clean MAC address (remove colons and dashes)
          CLEAN_MAC=$(echo "$MAC" | tr -d ':-')
          
          # Build magic packet using Python
          python3 -c "
import socket

mac = '$CLEAN_MAC'
target_ip = '$TARGET_IP'

# Convert hex string to bytes
mac_bytes = bytes.fromhex(mac)

# Build magic packet: 6 x FF + MAC repeated 16 times
magic_packet = b'\xff' * 6 + mac_bytes * 16

# Send via UDP broadcast on port 7
sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
sock.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)
try:
    sock.sendto(magic_packet, (target_ip, 7))
    print('Magic packet sent successfully')
except Exception as e:
    print(f'Error sending packet: {e}')
finally:
    sock.close()
"
