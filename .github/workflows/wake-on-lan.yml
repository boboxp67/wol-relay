name: Wake on LAN Relay

on:
  workflow_dispatch:
    inputs:
      mac_address:
        description: 'MAC address of the target PC'
        required: true
      target_ip:
        description: 'Public IP of the home network'
        required: true

jobs:
  send-wol:
    runs-on: ubuntu-latest
    steps:
      - name: Send Wake-on-LAN magic packet via bash UDP
        run: |
          MAC="${{ inputs.mac_address }}"
          TARGET_IP="${{ inputs.target_ip }}"
          
          echo "Sending WOL to $MAC at $TARGET_IP"
          
          # Clean MAC address (remove colons and dashes)
          CLEAN_MAC=$(echo "$MAC" | tr -d ':-')
          
          # Build magic packet as hex string: 6 x FF + MAC repeated 16 times
          MAGIC_PACKET="FFFFFFFF$(for i in {1..16}; do echo -n "$CLEAN_MAC"; done)"
          
          # Convert hex to binary and send via UDP broadcast using bash's /dev/udp
          exec 3>/dev/udp/$TARGET_IP/7
          printf "$(echo $MAGIC_PACKET | sed 's/\(..\)/\\x\1/g')" >&3
          exec 3>&-
          
          echo "Magic packet sent successfully!"
