name: Wake on LAN Relay

on:
  workflow_dispatch:
    inputs:
      mac_address:
        description: 'MAC address of the target PC'
        required: true
      target_ip:
        description: 'Public IP of the home network'
        required: true

jobs:
  send-wol:
    runs-on: ubuntu-latest
    steps:
      - name: Write Python script to file
        run: |
          cat > wol.py << 'PYEOF'
import socket
import sys

mac = sys.argv[1]
target_ip = sys.argv[2]

# Clean MAC address
clean_mac = mac.replace(":", "").replace("-", "")

try:
    # Convert hex string to bytes
    mac_bytes = bytes.fromhex(clean_mac)
except ValueError as e:
    print(f"Invalid MAC address format: {e}")
    sys.exit(1)

# Build magic packet: 6 x FF + MAC repeated 16 times
magic_packet = b"\xff" * 6 + mac_bytes * 16

print(f"Sending WOL to {mac} at {target_ip}:7")

try:
    # Send via UDP broadcast on port 7
    sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
    sock.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)
    sock.sendto(magic_packet, (target_ip, 7))
    print("Magic packet sent successfully!")
except Exception as e:
    print(f"Error sending packet: {e}")
finally:
    sock.close()
PYEOF

      - name: Send Wake-on-LAN magic packet
        run: python3 wol.py "${{ inputs.mac_address }}" "${{ inputs.target_ip }}"
